services:
  # ─────────────────────────────────────────
  # PostgreSQL — persistent memory for agent
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gnani_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gnani
      POSTGRES_PASSWORD: gnani_secret
      POSTGRES_DB: gnani_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnani -d gnani_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # n8n — integration and workflow execution
  # ─────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: gnani_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=gnani_n8n_secret
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=gnani_n8n
      - DB_POSTGRESDB_USER=gnani
      - DB_POSTGRESDB_PASSWORD=gnani_secret
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflows:/home/node/.n8n/workflows
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────
  # Redis — optional cache / queue layer
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gnani_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  n8n_data:
